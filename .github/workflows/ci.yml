name: Quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: casa_bruma
          POSTGRES_USER: bruma
          POSTGRES_PASSWORD: bruma_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bruma -d casa_bruma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bruma:bruma_ci@127.0.0.1:5432/casa_bruma?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_COOKIE_NAME: bruma_session
      SESSION_TTL_HOURS: 12
      IP_HASH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      SEED_ADMIN_EMAIL: admin@casabruma.local
      SEED_ADMIN_PASSWORD: ChangeMe-Local-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
